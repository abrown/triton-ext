name: CI
description: |
  Continuous integration workflow for triton-ext.
  - Build triton-ext dependencies in workspace directories: LLVM (`llvm-<hash>-<os>-<arch>`) and Triton (`triton`)

on:
  push:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  schedule:
    # Run daily to check for upstream changes
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.config.runner }}
    runs-on: ${{ matrix.config.runs_on }}
    timeout-minutes: 300

    strategy:
      fail-fast: true
      matrix:
        config:
        - {runner: 'Ubuntu 22.04', runs_on: 'ubuntu-22.04', target-os: 'ubuntu', arch: 'x64'}
        # - {runner: 'Ubuntu 22.04 ARM64', runs_on: 'ubuntu-22.04', target-os: 'ubuntu', arch: 'arm64'}
        # - {runner: 'AlmaLinux 8', runs_on: ['self-hosted', 'CPU'], target-os: 'almalinux', arch: 'x64'}
        # - {runner: 'AlmaLinux 8 ARM64', runs_on: 'ubuntu-22.04-arm', target-os: 'almalinux', arch: 'arm64'}
        # - {runner: 'MacOS X64', runs_on: 'macos-15', target-os: 'macos', arch: 'x64'}
        # - {runner: 'MacOS ARM64', runs_on: 'macos-15', target-os: 'macos', arch: 'arm64'}
        # - {runner: 'Windows Latest', runs_on: 'windows-latest', target-os: 'windows', arch: 'x64'}

    steps:
      - name: Checkout triton-ext
        uses: actions/checkout@v4

      - name: Collect commit hashes
        id: hashes
        shell: bash
        run: |
          TRITON_HASH=$(ci/fetch-triton-hash.py)
          echo "triton_hash=$TRITON_HASH" >> $GITHUB_OUTPUT
          echo "Triton hash: $TRITON_HASH"

          LLVM_HASH=$(ci/fetch-llvm-hash-from-triton.py $TRITON_HASH)
          echo "llvm_hash=$LLVM_HASH" >> $GITHUB_OUTPUT
          echo "LLVM hash: $LLVM_HASH"

      - name: Setup sccache
        if: steps.check-artifact.outputs.exists == 'false'
        uses: mozilla-actions/sccache-action@v0.0.9
        # Both LLVM and Triton builds use sccache, so we set it up at the beginning of the workflow.

      - name: Build LLVM
        id: build-llvm
        uses: ./.github/actions/build-llvm
        with:
          llvm_hash: ${{ steps.hashes.outputs.llvm_hash }}

      - name: Build Triton
        id: build-triton
        uses: ./.github/actions/build-triton
        with:
          triton_hash: ${{ steps.hashes.outputs.triton_hash }}
          llvm_install_dir: ${{ steps.build-llvm.outputs.llvm_install_dir }}

      - name: List files
        shell: bash
        run: du -h .
