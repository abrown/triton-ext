name: Build LLVM

on:
  push:
    paths:
      - '.github/workflows/**'
  schedule:
    # Run daily to check for upstream changes
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build-llvm:
    name: Build LLVM
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout Triton
        uses: actions/checkout@v4
        with:
          repository: triton-lang/triton

      - name: Fetch LLVM hash
        id: fetch-hash
        run: |
          HASH=$(cat cmake/llvm-hash.txt | tr -d '[:space:]')
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "cache-key=llvm-$HASH" >> $GITHUB_OUTPUT
          echo "LLVM hash: $HASH"

      - name: Check cache
        id: cache-check
        uses: actions/cache@v4
        with:
          path: build-llvm
          key: ${{ steps.fetch-hash.outputs.cache-key }}
          lookup-only: true

      - name: Skip if cached
        if: steps.cache-check.outputs.cache-hit == 'true'
        run: echo "LLVM artifacts already cached, skipping build"

      - name: Install dependencies
        if: steps.cache-check.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            git \
            clang \
            lld

      - name: Build LLVM with Triton script
        if: steps.cache-check.outputs.cache-hit != 'true'
        run: |
          export LLVM_BUILD_SHARED_LIBS=1
          export LLVM_INSTALL_PATH="${{ github.workspace }}/build-llvm"
          export LLVM_PROJECT_PATH="${{ github.workspace }}/llvm-project"
          export LLVM_BUILD_PATH="${{ github.workspace }}/llvm-project/build"
          export LLVM_COMMIT_HASH="${{ steps.fetch-hash.outputs.hash }}"

          ./scripts/build-llvm-project.sh

      - name: Cache LLVM artifacts
        if: steps.cache-check.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: build-llvm
          key: ${{ steps.fetch-hash.outputs.cache-key }}

      - name: Verify LLVM build
        if: steps.cache-check.outputs.cache-hit != 'true'
        run: |
          test -f build-llvm/lib/libLLVM.so || exit 1
          test -f build-llvm/lib/libMLIR.so || exit 1
          echo "LLVM build verified!"
